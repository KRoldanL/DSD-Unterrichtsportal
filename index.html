<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSD-Unterrichtsportal</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fa;
}

header{
    background:#0b5ed7;
    color:white;
    text-align:center;
    padding:40px;
}

main{
    max-width:1100px;
    margin:auto;
    padding:40px;
}

.card{

    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0px 5px 15px rgba(0,0,0,.15);
    margin-bottom:25px;

}

button{

background:#0b5ed7;
color:white;
border:none;
padding:15px 25px;
border-radius:8px;
font-size:18px;
cursor:pointer;

}

button:hover{

background:#084298;

}

</style>

</head>

<body>

<header>

<h1>🎓 DSD-Unterrichtsportal</h1>

<p>Willkommen!</p>

</header>

<main>

<div class="card">

<h2>Grammatikspiele</h2>

<p>Passiv und Passiversatzformen</p>

<button>Spiel starten</button>

</div>

</main>

</body>

</html>
